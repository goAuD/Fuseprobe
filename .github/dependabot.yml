version: 2
multi-ecosystem-groups:
  weekly-batch:
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    labels:
      - dependencies

updates:
  - package-ecosystem: cargo
    directory: /
    patterns:
      - "*"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
    multi-ecosystem-group: weekly-batch

  - package-ecosystem: npm
    directory: /apps/desktop
    patterns:
      - "*"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    multi-ecosystem-group: weekly-batch

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    multi-ecosystem-group: weekly-batch
