name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            artifact_name: fuseprobe-windows-x64
            bundle_glob: target/release/bundle/nsis/*-setup.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci

      - name: Run frontend tests
        run: npm --prefix apps/desktop test -- --run

      - name: Run Rust tests
        run: cargo test

      - name: Build desktop installer
        run: npm --prefix apps/desktop run tauri:build

      - name: Generate release checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ matrix.bundle_glob }}" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash *$($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.bundle_glob }}
            ${{ matrix.bundle_glob }}.sha256

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @()
          Get-ChildItem -Path "${{ matrix.bundle_glob }}" | ForEach-Object { $assets += $_.FullName }
          Get-ChildItem -Path "${{ matrix.bundle_glob }}.sha256" | ForEach-Object { $assets += $_.FullName }
          $notesFile = "docs/releases/release-$env:RELEASE_TAG.md"
          $notesArgs = @()
          if (Test-Path $notesFile) {
            $notesArgs = @("--notes-file", $notesFile)
          } else {
            $notesArgs = @("--generate-notes")
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_TAG @notesArgs
          }
          gh release upload $env:RELEASE_TAG $assets --repo $env:GITHUB_REPOSITORY --clobber
