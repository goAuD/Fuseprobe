name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "assets/fuseprobe.png"
      - "assets/fuseprobe_social.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time, and never cancel one midway: a half finished
# deploy would leave the published site in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build And Deploy Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage shared image assets
        # The site reuses the images that already live in assets/, so they are
        # copied in at deploy time rather than duplicated in the repository.
        run: cp assets/fuseprobe.png assets/fuseprobe_social.png site/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
